name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      pgsql:
        image: postgres:17
        env:
          POSTGRES_DB: muhasebi_test
          POSTGRES_USER: muhasebi
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U muhasebi"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, redis, intl, bcmath
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Code style
        run: vendor/bin/pint --test
      - name: Tests
        run: php artisan test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx nuxi typecheck
      - name: Build
        run: npm run build

  docker:
    # Makes sure the production images still build (same Dockerfiles the VPS uses).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/production/Dockerfile.api -t muhasebi-api:ci .
      - name: Build web image
        run: docker build -f infra/production/Dockerfile.web -t muhasebi-web:ci .
      - name: Validate Caddyfile
        run: docker run --rm -e DOMAIN=app.example.com -e ACME_EMAIL=ci@example.com --entrypoint caddy muhasebi-web:ci validate --config /etc/caddy/Caddyfile --adapter caddyfile
