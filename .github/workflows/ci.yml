name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Actions tab → CI → "Run workflow" on main: tests, then deploys again.
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      pgsql:
        image: postgres:17
        env:
          POSTGRES_DB: muhasebi_test
          POSTGRES_USER: muhasebi
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U muhasebi -d muhasebi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, redis, intl, bcmath, gd
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Code style
        run: vendor/bin/pint --test
      - name: Tests
        run: php artisan test

  # The marketplace's search definitions against a real Elasticsearch, with the memory the small
  # production server gives it (setup-search.sh: 512m heap, 1g cap). Not needed for deploys.
  search:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "true"
          xpack.security.http.ssl.enabled: "false"
          xpack.security.transport.ssl.enabled: "false"
          xpack.ml.enabled: "false"
          ELASTIC_PASSWORD: secret
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --memory 1g
          --health-cmd "curl -fs -u elastic:secret http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 10s --health-timeout 10s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, redis, intl, bcmath, gd
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Search against Elasticsearch
        env:
          SEARCH_LIVE_URL: http://localhost:9200
          SEARCH_LIVE_USERNAME: elastic
          SEARCH_LIVE_PASSWORD: secret
        # Failures become annotations, so they can be read without the job log.
        run: |
          vendor/bin/phpunit tests/Feature/SearchLiveTest.php --fail-on-skipped --log-junit junit.xml || {
            php -r '$x = simplexml_load_file("junit.xml"); foreach ($x->xpath("//failure|//error") as $f) { echo "::error title=SearchLiveTest::".str_replace(["%", "\r", "\n"], ["%25", "%0D", "%0A"], substr((string) $f, 0, 2000))."\n"; }'
            exit 1
          }

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx nuxi typecheck
      - name: Build
        run: npm run build

  admin:
    # The platform admin panel (its own app and domain).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx nuxi typecheck
      - name: Build
        run: npx nuxi generate && node scripts/csp.mjs

  site:
    # The public website (landing page, pricing, guide), prerendered.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx nuxi typecheck
      - name: Build
        run: npx nuxi generate

  store:
    # The shops' online stores (server-rendered).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/store/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx nuxi typecheck
      - name: Build
        run: npx nuxi build

  docker:
    # Makes sure the production images still build (same Dockerfiles the VPS uses).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f infra/production/Dockerfile.api -t muhasebi-api:ci .
      - name: Build web image
        run: docker build -f infra/production/Dockerfile.web -t muhasebi-web:ci .
      - name: Build store image
        run: docker build -f infra/production/Dockerfile.store -t muhasebi-store:ci .
      - name: Validate Caddyfile
        run: docker run --rm -e SITE_ADDRESS=app.example.com -e ADMIN_SITE_ADDRESS=admin.example.com -e LANDING_SITE_ADDRESS='example.com, www.example.com' -e LANDING_DOMAIN=example.com -e STORE_SITE_ADDRESS='*.example.com' -e STORE_TLS=on-demand -e STORE_CUSTOM_ADDRESS=https:// -e ACME_EMAIL=ci@example.com --entrypoint caddy muhasebi-web:ci validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build backup image
        run: docker build -f infra/production/Dockerfile.backup -t muhasebi-backup:ci infra/production && docker run --rm muhasebi-backup:ci sh -c 'pg_dump --version && rclone version | head -n 1'
      - name: Shellcheck deploy scripts
        run: shellcheck infra/production/*.sh infra/production/backup/*.sh infra/search/*.sh

  deploy:
    # Every push to main that passes all checks goes live (see docs/DEPLOY.md, "النشر التلقائي").
    needs: [api, web, admin, site, store, docker]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server's authorized_keys pins this key to ci-deploy.sh; it only receives the sha.
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"

      - name: Check the live site
        if: vars.PRODUCTION_URL != ''
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "${{ vars.PRODUCTION_URL }}/up" -o /dev/null && echo "up"
