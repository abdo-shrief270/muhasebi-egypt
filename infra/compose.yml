# Local services for development: docker compose -f infra/compose.yml up -d
name: muhasebi

services:
  pgsql:
    image: postgres:17
    environment:
      POSTGRES_DB: muhasebi
      POSTGRES_USER: muhasebi
      POSTGRES_PASSWORD: secret
    ports: ["5432:5432"]
    volumes:
      - pgsql:/var/lib/postgresql/data
      - ./pgsql/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "muhasebi"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis:/data]

  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: muhasebi
      MINIO_ROOT_PASSWORD: secret123
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

volumes:
  pgsql:
  redis:
  minio:
