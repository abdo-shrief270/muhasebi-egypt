# Use when the server already runs nginx on ports 80/443 for other sites.
# nginx keeps the public ports and TLS; Caddy listens on localhost only.
# Enabled by COMPOSE_FILE=compose.yml:compose.nginx.yml in .env (./init.sh ... nginx).
services:
  caddy:
    environment:
      # The app answers on its own name (a catch-all ":80" would sort before the stores' *.<STORE_HOST>).
      SITE_ADDRESS: http://${DOMAIN}
      ADMIN_SITE_ADDRESS: http://${ADMIN_DOMAIN:-admin.invalid}
      LANDING_SITE_ADDRESS: http://${LANDING_DOMAIN:-landing.invalid}, http://www.${LANDING_DOMAIN:-landing.invalid}
      STORE_SITE_ADDRESS: http://*.${STORE_HOST:-store.invalid}
      STORE_TLS: none
      # Shops' own domains: nginx holds their certificates (sync-store-domains.sh) and passes them here.
      STORE_CUSTOM_ADDRESS: http://
      TRUSTED_PROXIES: private_ranges
    ports: !override
      - "127.0.0.1:${EDGE_PORT:-8088}:80"
