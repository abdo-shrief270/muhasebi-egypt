# Production stack. Run from this directory:  ./deploy.sh
# Secrets live in ./.env (created by ./init.sh, never committed).
name: muhasebi

x-php: &php
  build:
    context: ../..
    dockerfile: infra/production/Dockerfile.api
  image: muhasebi-api:latest
  env_file: .env
  environment:
    # The app publishes broadcasts straight to the reverb container; browsers use REVERB_HOST.
    REVERB_PUBLISH_HOST: reverb
    REVERB_PUBLISH_PORT: "8080"
    REVERB_PUBLISH_SCHEME: http
  restart: unless-stopped
  volumes:
    - storage:/app/storage
  depends_on:
    pgsql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  caddy:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile.web
      args:
        APP_URL: https://${DOMAIN}
        SITE_URL: https://${LANDING_DOMAIN:-muhasebi.com}
        APP_VERSION: ${APP_VERSION:-}
        GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
        BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
        FACEBOOK_DOMAIN_VERIFICATION: ${FACEBOOK_DOMAIN_VERIFICATION:-}
        GA_ID: ${GA_ID:-}
        META_PIXEL_ID: ${META_PIXEL_ID:-}
        CONTACT_WHATSAPP: ${CONTACT_WHATSAPP:-}
        FACEBOOK_URL: ${FACEBOOK_URL:-}
        INSTAGRAM_URL: ${INSTAGRAM_URL:-}
        TIKTOK_URL: ${TIKTOK_URL:-}
        YOUTUBE_URL: ${YOUTUBE_URL:-}
        OFFER_TEXT: ${OFFER_TEXT:-}
        OFFER_CODE: ${OFFER_CODE:-}
        OFFER_UNTIL: ${OFFER_UNTIL:-}
    image: muhasebi-web:latest
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${DOMAIN}
      ADMIN_SITE_ADDRESS: ${ADMIN_DOMAIN:-http://admin.invalid}
      # The public website: "example.com, www.example.com" (setup-landing.sh writes it).
      LANDING_SITE_ADDRESS: ${LANDING_SITE_ADDRESS:-http://landing.invalid}
      LANDING_DOMAIN: ${LANDING_DOMAIN:-landing.invalid}
      # The shops' online stores: "*.example.com" with STORE_TLS=on-demand (setup-store.sh writes them).
      STORE_SITE_ADDRESS: ${STORE_SITE_ADDRESS:-http://store.invalid}
      STORE_TLS: ${STORE_TLS:-none}
      # Shops' own domains: "https://" with STORE_TLS=on-demand (setup-store.sh writes it); off by default.
      STORE_CUSTOM_ADDRESS: ${STORE_CUSTOM_ADDRESS:-http://custom.invalid}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    <<: *php
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *php
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s
    healthcheck:
      disable: true

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  # The shops' online stores (server-rendered Nuxt), reached through Caddy on STORE_DOMAIN.
  store:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile.store
    image: muhasebi-store:latest
    restart: unless-stopped
    environment:
      NUXT_API_INTERNAL: http://api/api/v1
      NUXT_PUBLIC_STORE_HOST: ${STORE_HOST:-}
      NUXT_PUBLIC_STORE_URL: https://${STORE_DOMAIN:-store.invalid}
      NUXT_PUBLIC_SITE_URL: https://${LANDING_DOMAIN:-muhasebi.com}
    depends_on:
      - api

  reverb:
    <<: *php
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    healthcheck:
      disable: true

  pgsql:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      retries: 20

  # Daily pg_dump into ./backups (kept BACKUP_KEEP_DAYS), optionally copied off-site with rclone.
  # See docs/DEPLOY.md; ./backup.sh takes one now, ./restore.sh puts one back.
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: muhasebi-backup:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: pgsql
      PGPORT: "5432"
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_DATABASE}
      TZ: ${BACKUP_TZ:-Africa/Cairo}
    volumes:
      - ./backups:/backups
      # The api's stored files (photos, payment proofs…), read-only: archived next to each dump.
      - storage:/storage:ro
    depends_on:
      pgsql:
        condition: service_healthy
    healthcheck:
      # Unhealthy when the last good backup is more than 25 hours old.
      test: ["CMD-SHELL", "test -n \"$$(find /backups -maxdepth 1 -name .last-success -mmin -1500)\""]
      interval: 5m
      timeout: 10s
      start_period: 30m

  # The marketplace's search (Elasticsearch, one node). Off unless COMPOSE_PROFILES has "search"
  # (./setup-search.sh). Only the app's containers reach it: no port is published.
  search:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-9.1.0}
    profiles: [search]
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - cluster.name=muhasebi
      - node.name=search-1
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.ml.enabled=false
      - ELASTIC_PASSWORD=${SEARCH_PASSWORD:-}
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-512m} -Xmx${ES_HEAP:-512m}
    # A hard cap so search can never starve Postgres / the POS (heap + about half again).
    mem_limit: ${ES_MEM_LIMIT:-1g}
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:$$ELASTIC_PASSWORD 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
  redisdata:
  storage:
  caddy_data:
  caddy_config:
  esdata:
