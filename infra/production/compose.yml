# Production stack. Run from this directory:  ./deploy.sh
# Secrets live in ./.env (created by ./init.sh, never committed).
name: muhasebi

x-php: &php
  build:
    context: ../..
    dockerfile: infra/production/Dockerfile.api
  image: muhasebi-api:latest
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/app/storage
  depends_on:
    pgsql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  caddy:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile.web
    image: muhasebi-web:latest
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${DOMAIN}
      ADMIN_SITE_ADDRESS: ${ADMIN_DOMAIN:-http://admin.invalid}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    <<: *php
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *php
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s
    healthcheck:
      disable: true

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  reverb:
    <<: *php
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    healthcheck:
      disable: true

  pgsql:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
  redisdata:
  storage:
  caddy_data:
  caddy_config:
