# nginx site for Muhasebi (when nginx already serves other sites on this server).
# Install:
#   sed "s/app.example.com/YOUR_DOMAIN/" nginx-site.conf > /etc/nginx/sites-available/muhasebi
#   ln -s /etc/nginx/sites-available/muhasebi /etc/nginx/sites-enabled/muhasebi
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d YOUR_DOMAIN      # adds HTTPS to this file
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    client_max_body_size 20m;

    # Reverb websockets (Laravel Echo -> wss://<domain>/app/...)
    location /app/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# The admin panel on its own domain (ADMIN_DOMAIN in .env). Same Caddy behind it; Caddy tells
# the two apart by the host. Get its certificate with: certbot --nginx -d YOUR_ADMIN_DOMAIN
server {
    listen 80;
    listen [::]:80;
    server_name admin.example.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# The shops' online stores on subdomains (*.example.com; STORE_HOST in .env). Same Caddy behind it.
# Exact names (app., admin., www.) win over the wildcard in nginx, so only stores land here.
# Certificate: one wildcard, from Cloudflare DNS (setup-store.sh runs
#   certbot certonly --dns-cloudflare --cert-name muhasebi-stores -d '*.example.com').
server {
    listen 80;
    listen [::]:80;
    server_name *.example.com;
    return 301 https://$host$request_uri;
}

server {
    # (http2 in listen works on old and new nginx; newer ones only warn)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.example.com;

    ssl_certificate /etc/letsencrypt/live/muhasebi-stores/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muhasebi-stores/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}

# The public website on the root domain (LANDING_DOMAIN in .env, plus www). Same Caddy behind it.
# Get its certificate with: certbot --nginx -d example.com -d www.example.com
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
