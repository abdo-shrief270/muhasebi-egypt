# nginx site for Muhasebi (when nginx already serves other sites on this server).
# Install:
#   sed "s/app.example.com/YOUR_DOMAIN/" nginx-site.conf > /etc/nginx/sites-available/muhasebi
#   ln -s /etc/nginx/sites-available/muhasebi /etc/nginx/sites-enabled/muhasebi
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d YOUR_DOMAIN      # adds HTTPS to this file
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    client_max_body_size 20m;

    # Reverb websockets (Laravel Echo -> wss://<domain>/app/...)
    location /app/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
