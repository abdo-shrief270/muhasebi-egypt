# The marketplace's search server (Elasticsearch, one node) on its own machine, behind Caddy for
# HTTPS and an IP allowlist (only the app server). Set up with ./setup.sh; values live in .env.
name: muhasebi-search

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-9.1.0}
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - cluster.name=muhasebi
      - node.name=search-1
      - xpack.security.enabled=true
      # TLS ends at Caddy; the node is only reachable on this compose network.
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.ml.enabled=false
      - bootstrap.memory_lock=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:?run ./setup.sh}
      - ES_JAVA_OPTS=-Xms${ES_HEAP:-2g} -Xmx${ES_HEAP:-2g}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs -u elastic:$$ELASTIC_PASSWORD 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [elasticsearch]
    ports: ["80:80", "443:443"]
    environment:
      - SEARCH_DOMAIN=${SEARCH_DOMAIN:?run ./setup.sh}
      - ALLOWED_IPS=${ALLOWED_IPS:?run ./setup.sh}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  esdata:
  caddy_data:
  caddy_config:
